<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Vibe Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <h1>🎉 Vibe Hub</h1>
    <p class="auth-sub">Your social playground</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="tab-btn active" onclick="showTab('login')">Login</button>
      <button id="tabRegister" class="tab-btn" onclick="showTab('register')">Register</button>
    </div>
    <div id="loginForm" class="auth-form">
      <input id="loginUser" type="text" placeholder="Username" autocomplete="username">
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn-primary" onclick="doLogin()">Login</button>
      <p id="loginMsg" class="msg"></p>
    </div>
    <div id="registerForm" class="auth-form" style="display:none">
      <input id="regUser" type="text" placeholder="Choose a username" autocomplete="username">
      <input id="regEmail" type="email" placeholder="Email address" autocomplete="email">
      <input id="regPass" type="password" placeholder="Create a password" autocomplete="new-password">
      <button class="btn-primary" onclick="doRegister()">Create Account</button>
      <p id="regMsg" class="msg"></p>
    </div>
  </div>
</div>

<div id="mainApp" style="display:none">
  <header class="top-bar">
    <span class="logo">🎉 Vibe Hub</span>
    <span id="topCoins" class="coins">💰 0</span>
  </header>

  <div id="viewFeed" class="view active">
    <h2>✨ Spotlight</h2>
    <div class="post-box">
      <textarea id="postText" placeholder="What's on your mind?" rows="2"></textarea>
      <button class="btn-primary" onclick="createPost()">Post</button>
    </div>
    <div id="feedList"></div>
  </div>

  <div id="viewGames" class="view">
    <h2>🎮 Games</h2>
    <div id="gameGrid" class="game-grid"></div>
  </div>

  <div id="viewChat" class="view">
    <h2>💬 Chat Rooms</h2>
    <div id="chatRooms"></div>
  </div>

  <div id="viewLeader" class="view">
    <h2>🏆 Leaderboard</h2>
    <div id="leaderList"></div>
  </div>

  <div id="viewProfile" class="view">
    <h2>👤 Profile</h2>
    <div id="profileInfo"></div>
    <button class="btn-premium" onclick="buyPremium()">⭐ Go Premium</button>
    <button class="btn-admin" id="adminBtn" style="display:none" onclick="showView('admin')">🔧 Admin Panel</button>
    <button class="btn-danger" onclick="doLogout()">Logout</button>
  </div>

  <div id="viewAdmin" class="view">
    <h2>🔧 Admin Dashboard</h2>
    <div id="adminStats"></div>
    <button class="btn-primary" onclick="doWithdraw()" style="margin-bottom:10px">💸 Withdraw Earnings</button>
    <button class="btn-danger" onclick="showView('profile')">← Back to Profile</button>
  </div>

  <nav id="bottomNav">
    <button onclick="showView('feed')"><i class="fas fa-home"></i><span>Feed</span></button>
    <button onclick="showView('games')"><i class="fas fa-gamepad"></i><span>Games</span></button>
    <button onclick="showView('chat')"><i class="fas fa-comments"></i><span>Chat</span></button>
    <button onclick="showView('leader')"><i class="fas fa-trophy"></i><span>Rank</span></button>
    <button onclick="showView('profile')"><i class="fas fa-user"></i><span>Me</span></button>
  </nav>
</div>

<div id="gameModal" class="modal" style="display:none">
  <div class="modal-header">
    <button class="btn-close" onclick="closeGame()">✕</button>
    <span id="gameTitle">Game</span>
  </div>
  <div id="gameArea" class="game-area"></div>
  <div id="gameScore" class="game-score"></div>
</div>

<div id="chatModal" class="modal" style="display:none">
  <div class="modal-header">
    <button class="btn-close" onclick="closeChat()">← Back</button>
    <span id="chatRoomName"></span>
  </div>
  <div id="chatMessages" class="chat-messages"></div>
  <div class="chat-input-bar">
    <input id="chatInput" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button class="btn-primary" onclick="sendMessage()">Send</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
